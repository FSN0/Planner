{# Layout compartido para previews manuales Odoo #}
{% macro stat_chip(label, value, tone='') %}
<div class="sync-preview-stat sync-preview-stat--{{ tone }}">
  <span class="sync-preview-stat-val">{{ value }}</span>
  <span class="sync-preview-stat-lbl">{{ _(label) }}</span>
</div>
{% endmacro %}

{% macro razon_list(razones) %}
{% if razones %}
<ul class="sync-preview-razones mb-0">
  {% for r in razones %}
  <li>{{ _(r) }}</li>
  {% endfor %}
</ul>
{% endif %}
{% endmacro %}
