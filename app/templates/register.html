{% extends "base.html" %}
{% block title %}Registro de Currante{% endblock %}
{% block body_class %}layout-auth{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_layout.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 500px;">
    <div class="auth-logo">
        <i class="fas fa-user-plus"></i>
    </div>
    <h1 class="auth-title">Crear Cuenta</h1>
    <p class="auth-subtitle">Registro para nuevos operarios</p>

    <form method="POST">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label>Nombre</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group col-md-6">
                <label>Apellidos</label>
                <input type="text" name="lastname" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label>DNI</label>
            <input type="text" name="dni" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Código de Empresa</label>
            <input type="text" name="company_code" class="form-control" placeholder="Código facilitado por tu responsable" required>
        </div>

        <button type="submit" class="btn btn-primary btn-auth">Registrarse</button>
    </form>

    <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </div>
</div>
{% endblock %}
