{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block body_class %}layout-auth{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_layout.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-logo">
        <i class="fas fa-hard-hat"></i>
    </div>
    <h1 class="auth-title">Bienvenido</h1>
    <p class="auth-subtitle">Introduce tus credenciales para entrar</p>

    <form method="POST">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="nombre@empresa.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="form-group form-check text-left ml-1">
            <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
            <label class="form-check-label font-weight-normal text-muted" for="rememberCheck">Recordarme</label>
        </div>

        <button type="submit" class="btn btn-primary btn-auth">Iniciar Sesión</button>
    </form>

</div>
{% endblock %}
