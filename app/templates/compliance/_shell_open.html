{% extends "base.html" %}
{% block body_class %}layout-admin{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_layout.css') }}?v=20261005sub">
<style>
  .doc-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .doc-card h3 { font-size:1rem; margin:0 0 6px; }
  .pill { display:inline-block; border-radius:999px; padding:2px 8px; font-size:12px; background:#e2e8f0; }
  .pill-bad { background:#fee2e2; color:#991b1b; }
  .pill-warn { background:#fef3c7; color:#92400e; }
  .pill-ok { background:#dcfce7; color:#166534; }
  .kpi-row { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 18px; }
  .kpi { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; min-width:140px; }
  .kpi b { display:block; font-size:1.4rem; }
  details.obra { background:#fff; border:1px solid #e2e8f0; border-radius:12px; margin-bottom:10px; padding:8px 12px; }
  details.dia { margin:6px 0 6px 12px; }
  .linea { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 0; border-top:1px solid #f1f5f9; }
  .linea input[type="time"], .linea input[type="number"] { width:110px; }
  .solape { color:#b91c1c; font-weight:600; }
</style>
{% endblock %}
