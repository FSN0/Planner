{% extends "operario/base.html" %}
{% block title %}{{ _('Definir PIN') }}{% endblock %}
{% block contenido %}
<div class="entrar entrar--auth">
    <h1 class="titulo">{{ _('Define tu PIN') }}</h1>
    <p class="entrar__ayuda">
        {{ _('Elige un PIN de 4 a 6 dígitos para fichar con tu DNI. No lo compartas.') }}
    </p>

    <form method="POST" class="entrar__formulario" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="t" value="{{ token }}">

        <div class="campo">
            <label class="campo__etiqueta" for="pin_nuevo">{{ _('PIN nuevo') }}</label>
            <input class="campo__control campo__control--pin" type="password"
                   id="pin_nuevo" name="pin_nuevo" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" required autocomplete="new-password"
                   placeholder="••••">
        </div>
        <div class="campo">
            <label class="campo__etiqueta" for="pin_nuevo2">{{ _('Repite el PIN') }}</label>
            <input class="campo__control campo__control--pin" type="password"
                   id="pin_nuevo2" name="pin_nuevo2" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" required autocomplete="new-password"
                   placeholder="••••">
        </div>

        <button type="submit" class="boton boton--entrar">{{ _('Guardar PIN') }}</button>
    </form>
</div>
{% endblock %}
