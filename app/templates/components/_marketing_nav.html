{# Nav comercial. Enlaces con prefijo de idioma para que Google no mezcle lenguas. #}
<nav class="mkt-nav-links">
  <a href="{{ mkt_url('marketing.demo') }}">{{ _('Demo') }}</a>
  <a href="{{ mkt_url('marketing.soluciones_index') }}">{{ _('nav.solutions') }}</a>
  <a href="{{ mkt_url('marketing.recursos_index') }}">{{ _('nav.guides') }}</a>
  <a href="{{ mkt_url('marketing.contacto') }}">{{ _('footer.contact') }}</a>
  <a href="{{ mkt_url('marketing.entrar') }}">{{ _('nav.login') }}</a>
  <div class="mkt-lang">
    <label class="visually-hidden" for="mkt-lang">{{ _('nav.lang') }}</label>
    <select id="mkt-lang" onchange="window.location.href=this.value" aria-label="{{ _('nav.lang') }}">
      {% for code in supported_locales %}
      <option value="{{ locale_href(code) }}" {% if code == current_locale %}selected{% endif %}>
        {{ locale_labels[code] }}
      </option>
      {% endfor %}
    </select>
  </div>
  <a class="mkt-btn mkt-btn-primary mkt-btn-nav" href="{{ mkt_url('marketing.alta') }}">{{ _('nav.cta') }}</a>
</nav>
