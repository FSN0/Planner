{# Modal detalle KPI del panel (fichajes / asignaciones / auditoría). #}
<div class="modal fade" id="modalPanelKpiDetail" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content dashboard-kpi-detail-modal">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="panelKpiDetailTitle">{{ _('Detalle') }}</h5>
          <p class="modal-subtitle mb-0 text-muted small" id="panelKpiDetailSubtitle"></p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="{{ _('Cerrar') }}"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <div class="dashboard-kpi-detail-toolbar">
          <div class="dashboard-kpi-detail-date" id="panelKpiDetailDateWrap">
            <label class="admin-form-label mb-0" for="panelKpiDetailFecha">{{ _('Fecha') }}</label>
            <div class="dashboard-kpi-detail-date-controls">
              <button type="button" class="btn-admin btn-admin-ghost btn-sm" id="panelKpiDetailPrev" title="{{ _('Día anterior') }}">
                <i class="fas fa-chevron-left"></i>
              </button>
              <input type="date" id="panelKpiDetailFecha" class="form-control form-control-sm">
              <button type="button" class="btn-admin btn-admin-ghost btn-sm" id="panelKpiDetailNext" title="{{ _('Día siguiente') }}">
                <i class="fas fa-chevron-right"></i>
              </button>
              <button type="button" class="btn-admin btn-admin-ghost btn-sm" id="panelKpiDetailToday">{{ _('Hoy') }}</button>
            </div>
          </div>
          <div class="dashboard-kpi-detail-search">
            <label class="admin-form-label mb-0" for="panelKpiDetailSearch">{{ _('Buscar') }}</label>
            <input type="search" id="panelKpiDetailSearch" class="form-control form-control-sm"
                   placeholder="{{ _('Buscar en todos los campos…') }}" autocomplete="off">
          </div>
          <div class="dashboard-kpi-detail-meta">
            <span id="panelKpiDetailCount" class="page-toolbar-count"></span>
            <a href="#" id="panelKpiDetailAuditLink" class="btn-admin btn-admin-ghost btn-sm d-none">
              <i class="fas fa-external-link-alt"></i> {{ _('Ir a auditoría') }}
            </a>
          </div>
        </div>
        <div class="dashboard-kpi-detail-scroll">
          <table class="admin-data-table mb-0" id="panelKpiDetailTable">
            <thead id="panelKpiDetailHead"></thead>
            <tbody id="panelKpiDetailBody">
              <tr><td class="table-empty-state">{{ _('Cargando…') }}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
