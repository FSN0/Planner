<link rel="stylesheet" href="{{ url_for('static', filename='css/person_day_timeline.css') }}">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<div class="trace-panel border rounded">
  <div class="trace-filters p-3 bg-light border-bottom">
    <div class="row align-items-end">
      <div class="col-md-5 mb-2 mb-md-0">
        <label class="small font-weight-bold text-secondary mb-1">{{ _('Operario') }}</label>
        <select id="traceWorkerSelect" class="form-control form-control-sm" style="width: 100%;">
          <option value=""></option>
        </select>
      </div>
      <div class="col-6 col-md-2 mb-2 mb-md-0">
        <label class="small font-weight-bold text-secondary mb-1">{{ _('Desde') }}</label>
        <input type="date" id="traceDateFromInput" class="form-control form-control-sm font-weight-bold" value="{{ default_date_from or default_date }}">
      </div>
      <div class="col-6 col-md-2 mb-2 mb-md-0">
        <label class="small font-weight-bold text-secondary mb-1">{{ _('Hasta') }}</label>
        <input type="date" id="traceDateToInput" class="form-control form-control-sm font-weight-bold" value="{{ default_date_to or default_date }}">
      </div>
      <div class="col-md-3">
        <button type="button" id="btnTraceSearch" class="btn btn-primary btn-sm btn-block font-weight-bold">
          <i class="fas fa-search mr-1"></i> {{ _('Consultar') }}
        </button>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-md-5">
        <label class="small font-weight-bold text-secondary mb-1">{{ _('Filtrar en historial') }}</label>
        <input type="search" id="traceTextFilter" class="form-control form-control-sm" placeholder="{{ _('Buscar en títulos, detalles, actores…') }}" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="p-4" id="personDayTimelinePanel" data-person-day-timeline-root>
    <div data-timeline-meta class="person-day-timeline-meta">
      <div class="person-day-timeline-meta-item">
        <strong>{{ _('Operario') }}</strong>
        <span data-timeline-empleado>—</span>
      </div>
      <div class="person-day-timeline-meta-item">
        <strong>{{ _('Periodo') }}</strong> <span data-timeline-fecha>—</span>
      </div>
      <div class="person-day-timeline-meta-item">
        <strong>{{ _('Estado') }}</strong>
        <span data-timeline-estado class="badge badge-secondary person-day-timeline-estado">—</span>
      </div>
    </div>
    <div data-timeline-content>
      <div class="person-day-timeline-empty">
        <i class="fas fa-user-clock fa-2x mb-2 text-muted"></i>
        <p class="mb-0">{{ _('Selecciona un operario y un rango de fechas para ver su historial.') }}</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{{ url_for('static', filename='js/person_day_timeline.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const panel = document.getElementById('personDayTimelinePanel');
    const workerSelect = $('#traceWorkerSelect');
    const dateFromInput = document.getElementById('traceDateFromInput');
    const dateToInput = document.getElementById('traceDateToInput');
    const textFilter = document.getElementById('traceTextFilter');
    const btnSearch = document.getElementById('btnTraceSearch');
    if (!panel || !workerSelect.length) return;

    workerSelect.select2({
        width: '100%',
        placeholder: {{ _('Buscar operario por nombre...')|tojson }},
        allowClear: true,
        ajax: {
            url: '{{ url_for("admin.search_workers") }}',
            dataType: 'json',
            delay: 250,
            data: params => ({ q: params.term || '' }),
            processResults: data => ({
                results: (data.results || []).filter(item => item.id !== 'GENERICO')
            })
        }
    });

    function runSearch() {
        const userId = workerSelect.val();
        const from = dateFromInput.value;
        const to = dateToInput.value;
        if (!userId) { alert({{ _('Selecciona un operario.')|tojson }}); return; }
        if (!from && !to) { alert({{ _('Selecciona al menos una fecha.')|tojson }}); return; }
        if (from && to && from > to) {
            alert({{ _('La fecha Desde no puede ser posterior a Hasta.')|tojson }});
            return;
        }
        PersonDayTimeline.loadRange(panel, userId, from || to, to || from, {
            loadingMessage: {{ _('Recopilando el historial del operario...')|tojson }}
        }).then(function () {
            if (textFilter && textFilter.value) {
                PersonDayTimeline.applyTextFilter(panel, textFilter.value);
            }
        });
    }

    btnSearch.addEventListener('click', runSearch);
    dateFromInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    dateToInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    if (textFilter) {
        textFilter.addEventListener('input', function () {
            PersonDayTimeline.applyTextFilter(panel, textFilter.value);
        });
    }
});
</script>
