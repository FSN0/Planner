<div class="modal fade person-day-timeline-modal" id="{{ modal_id or 'modalPersonDayTimeline' }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content person-day-timeline-modal-content">
      <div class="modal-header person-day-timeline-modal-header">
        <div class="person-day-timeline-modal-heading">
          <span class="person-day-timeline-modal-kicker"><i class="fas fa-stream"></i> {{ modal_title or _('Trazabilidad del día') }}</span>
          <h5 class="modal-title mb-0">
            <span data-timeline-empleado>—</span>
          </h5>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="{{ _('Cerrar') }}">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" data-person-day-timeline-root>
        <div data-timeline-meta class="person-day-timeline-meta">
          <div class="person-day-timeline-meta-item">
            <span class="person-day-timeline-meta-label">{{ _('Fecha') }}</span>
            <span data-timeline-fecha class="person-day-timeline-meta-value">—</span>
          </div>
          <div class="person-day-timeline-meta-item person-day-timeline-meta-item--fichaje" data-timeline-entrada-wrap hidden>
            <span class="person-day-timeline-meta-label">{{ _('Entrada') }}</span>
            <span data-timeline-entrada class="person-day-timeline-meta-value">—</span>
          </div>
          <div class="person-day-timeline-meta-item person-day-timeline-meta-item--fichaje" data-timeline-salida-wrap hidden>
            <span class="person-day-timeline-meta-label">{{ _('Salida') }}</span>
            <span data-timeline-salida class="person-day-timeline-meta-value">—</span>
          </div>
          <div class="person-day-timeline-meta-item">
            <span class="person-day-timeline-meta-label">{{ _('Estado') }}</span>
            <span data-timeline-estado class="badge-soft badge-soft-gray person-day-timeline-estado">—</span>
          </div>
        </div>
        <div data-timeline-content></div>
      </div>
      <div class="modal-footer person-day-timeline-modal-footer">
        <a href="#" class="btn-admin btn-admin-primary d-none" data-timeline-resolve-audit target="_self" rel="noopener">
          <i class="fas fa-gavel mr-1"></i> {{ _('Resolver en auditoría') }}
        </a>
        <button type="button" class="btn-admin btn-admin-ghost" data-dismiss="modal">{{ _('Cerrar') }}</button>
      </div>
    </div>
  </div>
</div>
