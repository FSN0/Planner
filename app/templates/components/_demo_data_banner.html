{% if demo_data_activa and current_user.is_authenticated and current_user.role == 'admin' %}
<div class="alert alert-warning border-0 rounded-0 mb-0 text-center" style="background:#fef3c7;color:#92400e;">
  <strong>Modo ejemplo:</strong> estás viendo datos de demostración.
  <form method="POST" action="{{ url_for('admin.primeros_pasos') }}" class="d-inline-flex flex-wrap justify-content-center align-items-center" style="gap:.5rem;margin-left:.5rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="accion" value="demo_borrar">
    <button type="submit" name="despues" value="panel" class="btn btn-sm btn-outline-dark">
      Borrar demo y quedar en panel vacío
    </button>
    <button type="submit" name="despues" value="wizard" class="btn btn-sm btn-dark">
      Borrar demo e ir a preparar mi empresa
    </button>
  </form>
</div>
{% endif %}
