name: Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Base de datos PostgreSQL como servicio
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_obra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      # Redis para rate limiting y Celery
      redis:
        image: redis:6-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Configurar Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
        cache: 'pip'
    
    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf xfonts-75dpi xfonts-base
    
    - name: Instalar dependencias Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Verificar conexión a PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Esperando PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL está listo"
    
    - name: Ejecutar tests
      env:
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_obra_test
        SECRET_KEY: test-secret-key-github-actions
        ENCRYPTION_KEY: hIQxMPbaYZ_WxJx4w3d9OaV8gQSNJFnKHQVfQPl7S1k=
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_TASK_ALWAYS_EAGER: true
        MAIL_SUPPRESS_SEND: true
        TESTING: true
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing -v
    
    - name: Subir cobertura a Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generar badge de cobertura
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Cobertura generada - ver Codecov"
    
    - name: Comentar cobertura en PR
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

  # Job adicional: Linting
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Instalar flake8
      run: |
        pip install flake8
    
    - name: Ejecutar linting
      run: |
        # Detener si hay errores de sintaxis o nombres indefinidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias sobre complejidad, longitud de línea, etc.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Job adicional: Security Check
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Instalar safety
      run: |
        pip install safety
    
    - name: Verificar vulnerabilidades en dependencias
      run: |
        pip install -r requirements.txt
        safety check --json || true
