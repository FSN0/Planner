# =============================================================================
# SignaPlan - Docker Compose DESARROLLO
# =============================================================================
# Uso: docker compose up -d  (o: make dev)
# Incluye bind mounts para hot-reload y puertos expuestos para debugging.
# =============================================================================

services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: python run.py
    expose:
      - "5000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      - FLASK_DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-hIQxMPbaYZ_WxJx4w3d9OaV8gQSNJFnKHQVfQPl7S1k=}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/gestion_obra_saas
      - SUPERADMIN_USER=${SUPERADMIN_USER:-admin@signaplan.com}
      - SUPERADMIN_PASS=${SUPERADMIN_PASS:-admin123}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-false}
      - ODOO_URL=${ODOO_URL:-}
      - ODOO_DB=${ODOO_DB:-}
      - ODOO_USER=${ODOO_USER:-}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-}
      - SSO_SECRET_KEY=${SSO_SECRET_KEY:-dev-sso-key}
      - ODOO_ALTA_APP_URL=${ODOO_ALTA_APP_URL:-}
      - ODOO_ALTA_TENANT_SLUG=${ODOO_ALTA_TENANT_SLUG:-soltec}
      - DOMAIN=${DOMAIN:-localhost}
      - LEGAL_RAZON_SOCIAL=${LEGAL_RAZON_SOCIAL:-}
      - LEGAL_NIF=${LEGAL_NIF:-}
      - LEGAL_DOMICILIO=${LEGAL_DOMICILIO:-}
      - LEGAL_EMAIL=${LEGAL_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:13
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gestion_obra_saas
    volumes:
      - postgres_data_saas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: celery -A app.celery_worker.celery worker --loglevel=info
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-hIQxMPbaYZ_WxJx4w3d9OaV8gQSNJFnKHQVfQPl7S1k=}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/gestion_obra_saas
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - ODOO_URL=${ODOO_URL:-}
      - ODOO_DB=${ODOO_DB:-}
      - ODOO_USER=${ODOO_USER:-}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-}
      - SSO_SECRET_KEY=${SSO_SECRET_KEY:-dev-sso-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: celery -A app.celery_worker.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-hIQxMPbaYZ_WxJx4w3d9OaV8gQSNJFnKHQVfQPl7S1k=}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/gestion_obra_saas
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - SSO_SECRET_KEY=${SSO_SECRET_KEY:-dev-sso-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Acceso desde el móvil en la misma WiFi (Windows/WSL suele no
      # publicar bien el :80 en la LAN; el :8080 suele llegar).
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data_saas:
  caddy_data:
  caddy_config:
