# =============================================================================
# SignaPlan - Docker Compose PRODUCCIÓN
# =============================================================================
# Uso: docker compose -f docker-compose.prod.yml up -d  (o: make prod-deploy)
# Sin bind mounts, con healthchecks, Gunicorn, y Caddy con HTTPS automático.
# =============================================================================

services:
  web:
    build: .
    restart: always
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gestion_obra_saas
      - SUPERADMIN_USER=${SUPERADMIN_USER}
      - SUPERADMIN_PASS=${SUPERADMIN_PASS}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - SSO_SECRET_KEY=${SSO_SECRET_KEY}
      - ODOO_ALTA_APP_URL=${ODOO_ALTA_APP_URL}
      - ODOO_ALTA_TENANT_SLUG=${ODOO_ALTA_TENANT_SLUG}
      - DOMAIN=${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gestion_obra_saas
    volumes:
      - postgres_data_saas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:6-alpine
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  celery_worker:
    build: .
    restart: always
    command: celery -A app.celery_worker.celery worker --loglevel=info --concurrency=2
    volumes:
      - uploads_data:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gestion_obra_saas
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - SSO_SECRET_KEY=${SSO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  celery_beat:
    build: .
    restart: always
    command: celery -A app.celery_worker.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gestion_obra_saas
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - SSO_SECRET_KEY=${SSO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  odoo_alta:
    build:
      context: ${ODOO_ALTA_BUILD_CONTEXT:-../soltec_creacion_contactos/odoo_web_app}
      dockerfile: Dockerfile
    container_name: odoo_alta
    restart: always
    expose:
      - "5002"
    environment:
      - FLASK_SECRET_KEY=${ODOO_ALTA_FLASK_SECRET_KEY}
      - SSO_SECRET_KEY=${SSO_SECRET_KEY}
      - SESSION_COOKIE_SECURE=true
      - SIGNAPLAN_AUTH_URL=http://web:5000/api/v6/odoo-alta/login
      - SIGNAPLAN_TENANT=${ODOO_ALTA_TENANT_SLUG:-soltec}
      - SIGNAPLAN_TENANT_HOST=${ODOO_ALTA_TENANT_HOST:-soltec.signaplan.com}
      - SIGNAPLAN_TENANT_NAME=${ODOO_ALTA_TENANT_NAME:-Soltec}
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    volumes:
      - odoo_alta_data:/app/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ODOO_ALTA_DOMAIN=${ODOO_ALTA_DOMAIN:-alta-odoo.signaplan.com}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      odoo_alta:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data_saas:
  caddy_data:
  caddy_config:
  uploads_data:
  odoo_alta_data:
