# Configuración de pytest para el proyecto

[pytest]
# Directorio donde están los tests
testpaths = tests

# Patrón de archivos que contienen tests
python_files = test_*.py

# Patrón de clases que contienen tests
python_classes = Test*

# Patrón de funciones que son tests
python_functions = test_*

# Marcadores personalizados (para categorizar tests)
markers =
    unit: Tests unitarios (funciones aisladas)
    integration: Tests de integración (varios componentes)
    slow: Tests lentos (pueden tardar varios segundos)
    multitenant: Tests relacionados con multi-tenancy
    auth: Tests de autenticación y autorización
    sync: Tests de sincronización con Odoo
    fichajes: Tests del sistema de fichajes
    api: Tests de endpoints API

# Opciones por defecto al ejecutar pytest
addopts = 
    # Muestra un resumen corto de los tests
    -ra
    # Modo verboso (muestra cada test que se ejecuta)
    -v
    # Ignora warnings de librerías de terceros
    --disable-warnings
    # Para debugging: muestra prints durante tests
    -s

# Variables de entorno para tests
env = 
    FLASK_ENV=testing
    TESTING=true
